name: Full Reproduction

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  reproduce-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Reproduce all simulation results"
        run: make reproduce-sim PY=python

      - name: "Verify reproducibility against committed results"
        run: python scripts/check_reproduce.py
