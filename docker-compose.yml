services:
  shikra:
    build: .
    image: shikra:latest
    network_mode: none
    volumes:
      - ./data:/app/data:ro
    command: ["sh", "-c", "make reproduce-sim PY=python && python scripts/check_reproduce.py"]

  app:
    build: .
    image: shikra:latest
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/Home.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

