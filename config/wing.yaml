# SHIKRA-Wing v0 configuration — ALL VALUES ARE SYNTHETIC
# See DATA_CARD.md for documentation and change log.

fleet:
  squadrons: 3          # S1, S2, S3
  aircraft_per_sqn: 18  # Tail IDs T01–T54
  engines_per_ac: 2

ops:
  sortie_demand: 0.8    # sorties per MC tail per day
  days: 365

maintenance:
  hangar_slots_per_sqn: 3
  planned_change_days: 2
  unscheduled_change_days: 5
  engine_repair:
    distribution: lognormal
    mean_days: 60
    cv: 0.4

spares:
  engines:
    base_per_sqn: 1
    depot: 3
    depot_to_base_days: 3

pipeline_mult: 1.9      # multiplies all repair TATs, transfer and lead times

lrus:
  - id: fuel_pump
    description: Fuel pump
    weibull_beta: 2.0
    weibull_eta: 400      # sorties
    source: domestic
    cost_lakh: 8
    repair_tat_days: 15
    lead_time_days: 45
    stock_base: 2
    stock_depot: 4

  - id: hyd_pump
